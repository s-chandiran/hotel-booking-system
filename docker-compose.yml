services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # BFF (server-only): where the Express API lives, which origins may write, cookie mode.
      API_UPSTREAM_URL: ${API_UPSTREAM_URL:-http://host.docker.internal:5000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # false only because the local demo is plain http://localhost; use true behind HTTPS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      HOTEL_SLUG: ${HOTEL_SLUG:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # MySQL 8.4 (DATABASE.md). Users are created by backend/docker/db-init on the FIRST start of an
  # empty volume only. Changing passwords later needs a manual ALTER USER or a fresh volume.
  db:
    # In the "tools" profile so plain `docker compose up` (web, mock data) is unchanged until Gate 4.
    profiles: ["tools"]
    image: mysql:8.4
    command:
      # Triggers are created by the non-SUPER migrator user while binary logging is on.
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${DB_NAME:-staydesk}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:-staydesk_migrator}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:-}
      DB_APP_USER: ${DB_APP_USER:-staydesk_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-}
    volumes:
      - staydesk-mysql:/var/lib/mysql
      - ./backend/docker/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Local tools only (bound to loopback).
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Express API (Gate 3b). Same "tools" profile, so plain `docker compose up` (web, mock data) is unchanged
  # until Gate 4. It refuses to start while migrations are pending (run `migrate` first) and runs as the
  # restricted app DB user. For the BFF to reach it, set API_UPSTREAM_URL=http://api:5000 in .env.
  #   docker compose --profile tools up -d --build api
  api:
    profiles: ["tools"]
    build:
      context: ./backend
    command: ["node", "dist/api/server.js"]
    environment:
      NODE_ENV: production
      API_PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-staydesk}
      DB_APP_USER: ${DB_APP_USER:-staydesk_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-28800}
      HOTEL_SLUG: ${HOTEL_SLUG:-}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    # No automatic restart: pending migrations or a missing JWT_SECRET are fixed by a person, not a retry loop.
    restart: "no"

  # Explicit one-off tools (never run automatically):
  #   docker compose --profile tools up -d db                   start MySQL
  #   docker compose --profile tools run --rm migrate           apply migrations
  #   docker compose --profile tools run --rm migrate status    list applied / pending
  #   docker compose --profile tools run --rm seed              demo data (refuses NODE_ENV=production)
  migrate:
    profiles: ["tools"]
    build:
      context: ./backend
    entrypoint: ["node", "dist/db/migrate.js"]
    command: ["latest"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-staydesk}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:-staydesk_migrator}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:-}
      DB_APP_USER: ${DB_APP_USER:-staydesk_app}
    depends_on:
      db:
        condition: service_healthy

  seed:
    profiles: ["tools"]
    build:
      context: ./backend
    command: ["node", "dist/db/seed-demo.js"]
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-staydesk}
      DB_APP_USER: ${DB_APP_USER:-staydesk_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-}
      HOTEL_SLUG: ${HOTEL_SLUG:-}
      SEED_BASE_DATE: ${SEED_BASE_DATE:-}
      DEMO_FRONT_DESK_USERNAME: ${DEMO_FRONT_DESK_USERNAME:-}
      DEMO_FRONT_DESK_PASSWORD: ${DEMO_FRONT_DESK_PASSWORD:-}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_SUPER_ADMIN_USERNAME: ${DEMO_SUPER_ADMIN_USERNAME:-}
      DEMO_SUPER_ADMIN_PASSWORD: ${DEMO_SUPER_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  staydesk-mysql:
